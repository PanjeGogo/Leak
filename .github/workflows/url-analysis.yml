name: Lua URL Capture

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Lua runtime
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Fetch upstream source as data
        run: |
          mkdir -p output
          curl --fail --location --silent --show-error \
            -A 'Mozilla/5.0 url-capture-emulator' \
            'https://raw.githubusercontent.com/Bliqe/Upload/refs/heads/main/Games/P/43136617997.lua' \
            -o output/upstream.lua

      - name: Static URL scan
        run: node tools/lua_url_emulator.js output/upstream.lua

      - name: Runtime URL interception
        run: lua5.4 tools/url_capture_emulator.lua output/upstream.lua
